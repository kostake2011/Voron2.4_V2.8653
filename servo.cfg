[servo blobi]
# Pin for the servo.
pin: PB6
# Adjust this value until a 'BLOBIFIER_SERVO POS=out' extends the tray fully without a 
# buzzing sound
minimum_pulse_width: 0.00043
# Adjust this value until a 'BLOBIFIER_SERVO POS=in' retracts the tray fully without a 
# buzzing sound
maximum_pulse_width: 0.0024
# Leave this value at 180
#maximum_servo_angle: 180
#initial_angle: 0


##########################################################################################
# The bucket hardware configuration. Change the pin to whatever pin you've connected the 
# switch to.
# 
[gcode_button bucket]
pin: PG6 # The pullup ( ^ ) is important here.
press_gcode: SET_LED LED="chamber" RED=0 GREEN=0 BLUE=0 WHITE=0 SYNC=0 TRANSMIT=1
#  M117 bucket installed
release_gcode: SET_LED LED="chamber" RED=0 GREEN=0 BLUE=0 WHITE=0.5 SYNC=0 TRANSMIT=1
#  M117 bucket removed

[gcode_macro REPEAT_SERVO_50]
description: Повторить движение сервопривода 50 раз
gcode:
    {% for i in range(50) %}
        SET_SERVO SERVO=blobi ANGLE=0
        G4 P3000
        SET_SERVO SERVO=blobi ANGLE=180
        G4 P3000
    {% endfor %}
    M117 Цикл завершен! Выполнено 50 повторений