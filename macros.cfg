# ============ M141: цель из слайсера ============
[gcode_macro M141]
description: Целевая T камеры (S). S0 - выключить
variable_chamber_target: 0.0
variable_integral: 0.0
gcode:
  {% set s = params.S|default(0)|float %}
  SET_GCODE_VARIABLE MACRO=M141 VARIABLE=chamber_target VALUE={s}
  {% if s > 0 %}
    UPDATE_DELAYED_GCODE ID=_CHAMBER_CONTROL DURATION=2
    {action_respond_info("M141: цель камеры %.0fC, контроллер запущен" % s)}
  {% else %}
    SET_GCODE_VARIABLE MACRO=M141 VARIABLE=integral VALUE=0
    SET_FAN_SPEED FAN=chamber_fan SPEED=0
    UPDATE_DELAYED_GCODE ID=_CHAMBER_CONTROL DURATION=0
  {% endif %}

[delayed_gcode _CHAMBER_CONTROL]
initial_duration: 0
gcode:
  {% set m = printer["gcode_macro M141"] %}
  {% if m.chamber_target > 0 %}
    # ================= НАСТРОЙКИ =================
    {% set FAN_MIN   = 0.10 %}  # обороты точно на цели
    {% set FAN_HEAT  = 0.30 %}  # прогрев
    {% set RAMP_ZONE = 2.0 %}   # глубже 2° ниже цели -> 30%
    {% set KP_HOLD   = 0.01 %}  # 1% на каждый градус ниже цели
    {% set KI        = 0.0005 %}# тонкий трим (медленный)
    {% set I_MAX     = 0.05 %}
    {% set I_MIN     = -0.05 %}
    {% set LEAK      = 0.99 %}  # "испарение" памяти вблизи цели
    {% set DT        = 3.0 %}
    {% set UP        = 0.02 %}
    {% set DOWN      = 0.01 %}
    {% set DOWN_HOT  = 0.03 %}
    # ================= ДАННЫЕ =================
    {% set bed_t   = printer.heater_bed.target|float(0) %}
    {% set bed_a   = printer.heater_bed.temperature %}
    {% set chamber = printer["temperature_sensor chamber"].temperature %}
    {% set fan_now = printer["fan_generic chamber_fan"].speed %}
    {% if (bed_t > 0) and (bed_a < bed_t - 2.0) %}
      {% set speed = 0.0 %}
      {% set integ = 0.0 %}
    {% else %}
      {% set error = m.chamber_target - chamber %}
      {% if error > RAMP_ZONE %}
        {% set base = FAN_HEAT %}                 # далеко ниже: греем
        {% set integ = 0.0 %}
      {% else %}
        # база: 10% на цели, +1% на градус ниже (ваша ручная логика)
        {% set base = FAN_MIN + KP_HOLD * error %}
        {% if base > FAN_HEAT %}{% set base = FAN_HEAT %}{% endif %}
        {% if base < FAN_MIN %}{% set base = FAN_MIN %}{% endif %}
        # тонкий трим + испарение памяти возле цели
        {% set integ = m.integral + error * KI * DT %}
        {% if error < 0.3 and error > -0.3 %}
          {% set integ = integ * LEAK %}
        {% endif %}
        {% if integ > I_MAX %}{% set integ = I_MAX %}{% endif %}
        {% if integ < I_MIN %}{% set integ = I_MIN %}{% endif %}
      {% endif %}
      {% set target_speed = base + integ %}
      {% if target_speed > FAN_HEAT %}{% set target_speed = FAN_HEAT %}{% endif %}
      {% if target_speed < FAN_MIN %}{% set target_speed = FAN_MIN %}{% endif %}
      # ---- плавность ----
      {% if fan_now < 0.005 %}
        {% set speed = target_speed %}
      {% else %}
        {% set dn = DOWN_HOT if error < 0 else DOWN %}
        {% set speed = [target_speed, fan_now + UP]|min %}
        {% set speed = [speed, fan_now - dn]|max %}
      {% endif %}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=M141 VARIABLE=integral VALUE={integ|round(4)}
    SET_FAN_SPEED FAN=chamber_fan SPEED={speed|round(3)}
    UPDATE_DELAYED_GCODE ID=_CHAMBER_CONTROL DURATION=3
  {% endif %}
  
# ---- опционально: задержка старта печати до прогрева камеры ----
[gcode_macro M191]
description: Ждать камеру >= S, кулерами не управляет
gcode:
  {% set s = params.S|default(0)|float %}
  {% if s > 0 %}
    TEMPERATURE_WAIT SENSOR="temperature_sensor chamber" MINIMUM={s}
  {% endif %}
# ---- опционально: задержка старта печати до прогрева камеры ----
[gcode_macro M191]
description: Ждать камеру >= S, кулерами не управляет
gcode:
  {% set s = params.S|default(0)|float %}
  {% if s > 0 %}
    TEMPERATURE_WAIT SENSOR="temperature_sensor chamber" MINIMUM={s}
  {% endif %}

[gcode_macro TOGGLE_MMU]
description: Toggle MMU on/off based on current state
gcode:
    {% if printer.mmu is defined %}
        {% set current_state = printer.mmu.enabled|int %}
        {% set new_state = 0 if current_state else 1 %}
        MMU ENABLE={new_state}
        {% if new_state %}
            RESPOND TYPE=command MSG="MMU: включён"
        {% else %}
            RESPOND TYPE=command MSG="MMU: выключен"
        {% endif %}
    {% else %}
        RESPOND TYPE=error MSG="MMU не настроен в конфиге"
    {% endif %}
