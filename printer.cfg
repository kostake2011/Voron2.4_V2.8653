[include mmu/base/*.cfg]
[include mmu/optional/client_macros.cfg]
[include mmu/addons/mmu_eject_buttons.cfg]
[include mmu/addons/blobifier.cfg] 
[include mmu/addons/mmu_exhaust.cfg]
[include moongate.cfg]
#[include mainsail.cfg]
[include sensorles.cfg]
[include shell_command.cfg]
[include ebb.cfg]
[include carto.cfg]
[include led.cfg]
[include shaper.cfg]
[include clean_nozzle.cfg]
[include macros.cfg]


[virtual_sdcard]
path: /home/pi/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[exclude_object]

[gcode_arcs]
resolution: 0.1

#[mcu mmu]
#serial: /dev/serial/by-id/usb-Klipper_stm32f407xx_57002C000E50414354393020-if00



[mcu]
canbus_uuid: 9ac21e40bfdf

[temperature_sensor Pi]
sensor_type: temperature_host

[temperature_sensor Octopus]
sensor_type: temperature_mcu

[temperature_sensor chamber]
sensor_type: Generic 3950
sensor_pin: PF5
min_temp: 0
max_temp: 70

[temperature_sensor bed]
sensor_type: Generic 3950
sensor_pin: PF4
min_temp: 0
max_temp: 110

[force_move]
enable_force_move: True

[printer]
kinematics: corexy
max_velocity: 400  
max_accel: 15000             
max_z_velocity: 15          
max_z_accel: 350
square_corner_velocity: 5.0
minimum_cruise_ratio: 0

[input_shaper]
shaper_freq_x: 64.4 #74 #54 #80
shaper_type_x: mzv
#damping_ratio_x : 0.100000
shaper_freq_y: 42.8 #72 #65 #70 #53
shaper_type_y: mzv
#damping_ratio_y:  0.100000
shaper_type_z: mzv
shaper_freq_z: 42.6


[stepper_x]
step_pin: PC13
dir_pin: PF0
enable_pin: !PF1
rotation_distance: 40
microsteps: 32
full_steps_per_rotation:200 
endstop_pin: tmc2240_stepper_x:virtual_endstop
position_min: 0
position_endstop: 303
position_max: 303
position_min: -3
homing_speed: 80  
homing_retract_dist: 0
homing_positive_dir: true

[tmc2240 stepper_x]
cs_pin: PE4
spi_bus: spi1
interpolate: false
run_current: 1.2
stealthchop_threshold: 0
#driver_TPFD: 0 
diag0_pin: ^!PG13
driver_SGT: 1


[stepper_y]
step_pin: PF11
dir_pin: PG3
enable_pin: !PG5
rotation_distance: 40
microsteps: 32
full_steps_per_rotation:200  
endstop_pin: tmc2240_stepper_y:virtual_endstop
position_min: 0
position_endstop: 310
position_max: 310
homing_speed: 80 
homing_retract_dist: 0
homing_positive_dir: true


[tmc2240 stepper_y]
cs_pin: PC6
spi_bus: spi1
interpolate: false
run_current: 1.2
stealthchop_threshold: 0
#driver_TPFD: 0 
diag0_pin: ^!PG10
driver_SGT: 1


[stepper_z]
step_pin: PE6
dir_pin: PA14
enable_pin: !PE0
rotation_distance: 40
gear_ratio: 80:16
microsteps: 64
endstop_pin: probe:z_virtual_endstop
position_max: 260
position_min: -5
homing_speed: 5
homing_retract_dist: 0

[tmc2209 stepper_z]
uart_pin: PD3
interpolate: false
run_current: 1
sense_resistor: 0.110
stealthchop_threshold: 99999


[stepper_z1]
step_pin: PE2
dir_pin: !PE3
enable_pin: !PD4
rotation_distance: 40
gear_ratio: 80:16
microsteps: 64


[tmc2209 stepper_z1]
uart_pin: PE1
interpolate: false
run_current: 1
sense_resistor: 0.110
stealthchop_threshold: 99999


[stepper_z2]
step_pin: PG0
dir_pin: PG1
enable_pin: !PF15
rotation_distance: 40
gear_ratio: 80:16
microsteps: 64


[tmc2209 stepper_z2]
uart_pin: PD11
interpolate: false
run_current: 1
sense_resistor: 0.110
stealthchop_threshold: 99999

[stepper_z3]
step_pin: PF13
dir_pin: !PF12
enable_pin: !PF14
rotation_distance: 40
gear_ratio: 80:16
microsteps: 64


[tmc2209 stepper_z3]
uart_pin: PC4
interpolate: false
run_current: 1
sense_resistor: 0.110
stealthchop_threshold: 99999



[idle_timeout]
timeout: 1800


[heater_bed]
heater_pin: PA0
sensor_type: Generic 3950
sensor_pin: PF3
max_power: 0.75
min_temp: 0
max_temp: 120
#control: pid
#pid_kp: 58.437
#pid_ki: 2.347
#pid_kd: 363.769

[quad_gantry_level]
gantry_corners:
   -60,-10
   360,370

points:
   50,25
   50,225
   250,225
   250,25

speed: 400
horizontal_move_z: 10
retries: 5
retry_tolerance: 0.0075
max_adjust: 10


[multi_pin my_fan]
pins: PA3,PB0

#[fan_generic chamber_fan]
#pin=multi_pin:my_fan
#kick_start_time: 0.05

# старый [fan_generic chamber_fan] убираем, multi_pin оставляем
# Убираем [heater_generic chamber] и [verify_heater chamber],
# возвращаем вентилятор на fan_generic:
[fan_generic chamber_fan]
pin: multi_pin:my_fan

# ============ M141: цель + состояние регулятора ============
# =====================================================================
#  КАМЕРА: M141 принимает цель из слайсера, PI-регулятор вентиляторов
#  Требует: [fan_generic chamber_fan] и [temperature_sensor chamber]
# =====================================================================



[multi_pin podval_fan]
pins: PA8,PE5,PD12

[temperature_fan podval_fan]
pin=multi_pin:podval_fan
kick_start_time: 0.05
sensor_type: temperature_host
control: watermark
shutdown_speed: 0.0
target_temp: 30.0
min_temp: 15
max_temp: 70
min_speed: 0.5
max_speed: 1

[gcode_macro PRINT_END]
#   Use PRINT_END for the slicer ending script - please customize for your slicer of choice
gcode:
    M400                           ; wait for buffer to clear
    G92 E0                         ; zero the extruder
    G1 E-4.0 F3600                 ; retract filament
    G91  
    
    #   Get Boundaries
    {% set max_x = printer.configfile.config["stepper_x"]["position_max"]|float %}
    {% set max_y = printer.configfile.config["stepper_y"]["position_max"]|float %}
    {% set max_z = printer.configfile.config["stepper_z"]["position_max"]|float %}

    #   Check end position to determine safe direction to move
    {% if printer.toolhead.position.x < (max_x - 20) %}
        {% set x_safe = 20.0 %}
    {% else %}
        {% set x_safe = -20.0 %}
    {% endif %}

    {% if printer.toolhead.position.y < (max_y - 20) %}
        {% set y_safe = 20.0 %}
    {% else %}
        {% set y_safe = -20.0 %}
    {% endif %}

    {% if printer.toolhead.position.z < (max_z - 2) %}
        {% set z_safe = 2.0 %}
    {% else %}
        {% set z_safe = max_z - printer.toolhead.position.z %}
    {% endif %}

    G0 Z{z_safe} F3600             ; move nozzle up
    G0 X{x_safe} Y{y_safe} F20000  ; move nozzle to remove stringing
    TURN_OFF_HEATERS
    M107                           ; turn off fan
    G90                            ; absolute positioning
    G0 X60 Y{max_y-10} F3600          ; park nozzle at rear
    _RESETSPEEDS

[gcode_macro _RESETSPEEDS]
gcode:
    SET_VELOCITY_LIMIT VELOCITY={printer.configfile.settings.printer.max_velocity} 
    SET_VELOCITY_LIMIT ACCEL={printer.configfile.settings.printer.max_accel}
    SET_VELOCITY_LIMIT MINIMUM_CRUISE_RATIO={printer.configfile.settings.printer.minimum_cruise_ratio}
    SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY={printer.configfile.settings.printer.square_corner_velocity}

